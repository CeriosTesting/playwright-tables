name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Build package
        run: npm run build

      - name: Check package exports
        run: npm run check-exports

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-min-playwright:
    name: Test (minimum supported Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The build tool (tsdown) needs Node 22.18 or later, so build first
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Then test on Node 20 on purpose: older Playwright versions hang loading ESM test files (tests/bundle/*.mjs) on Node 22+
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The lowest version allowed by peerDependencies, so the declared range is what we test
      - name: Install the minimum supported Playwright
        run: |
          MIN_VERSION=$(node -p "require('./package.json').peerDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")
          echo "Testing against @playwright/test@$MIN_VERSION"
          npm install --no-save @playwright/test@$MIN_VERSION
          npx playwright --version
          npx playwright install --with-deps

      - name: Type check
        run: npm run compile

      - name: Run tests
        run: npm run test

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-min-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Development happens on Windows, so the engine and the bundles are also tested there
  test-windows:
    name: Test (Windows, Chromium)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Stops at the first failing command, unlike a multi-line PowerShell step
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npx playwright test --project=chromium --project=dist-cjs --project=dist-esm

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7
