name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Package
    # Only main is released, also when the workflow is started from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      # The same checks as CI, so a release never skips one
      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        run: npm run compile

      - name: Build
        run: npm run build

      - name: Check package exports
        run: npm run check-exports

      - name: Test
        run: npm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        # Trusted publishing adds the provenance attestation, changesets 3 rejects a --provenance flag
        with:
          version-script: npm run changeset:version
          publish-script: npm run changeset:publish
          commit-message: "chore(release): bump version"
          pr-title: "chore(release): bump version"
