<!doctype html>
<html lang="en">
	<head>
		<title>Tables inside shadow roots</title>
	</head>
	<body>
		<h2>Tables inside shadow roots</h2>
		<p>
			Like web component grids: every table lives in the open shadow root of a custom element, so the table root is the
			host element.
		</p>

		<h3>Table in a shadow root</h3>
		<users-table id="Host"></users-table>

		<h3>Table in a shadow root inside another shadow root</h3>
		<outer-card id="OuterHost"></outer-card>

		<h3>Table with a nested table in a shadow root of a cell</h3>
		<orders-table id="NestedHost"></orders-table>

		<script>
			const style = `
				<style>
					table, th, td { border: 1px solid black; border-collapse: collapse; }
					th, td { padding: 5px; text-align: left; }
				</style>
			`;

			function shadow(host, html) {
				const root = host.attachShadow({ mode: "open" });
				root.innerHTML = style + html;
				return root;
			}

			shadow(
				document.getElementById("Host"),
				`<table>
					<thead>
						<tr><th colspan="2">Person</th><th rowspan="2">Status</th><th>Details</th></tr>
						<tr><th>Name</th><th>Email</th><th>Orders</th></tr>
					</thead>
					<tbody>
						<tr><td>John</td><td>john@example.com</td><td rowspan="2">Active</td><td>3</td></tr>
						<tr><td>Jane</td><td>jane@example.com</td><td>0</td></tr>
						<tr><td>Joe</td><td>joe@example.com</td><td>Inactive</td><td>7</td></tr>
					</tbody>
				</table>`
			);

			const outer = shadow(
				document.getElementById("OuterHost"),
				`<section><inner-table id="InnerHost"></inner-table></section>`
			);
			shadow(
				outer.getElementById("InnerHost"),
				`<table>
					<thead><tr><th>Id</th><th>City</th></tr></thead>
					<tbody>
						<tr><td>1</td><td>Amsterdam</td></tr>
						<tr><td>2</td><td>Berlin</td></tr>
						<tr><td>3</td><td>Copenhagen</td></tr>
					</tbody>
				</table>`
			);

			const orders = shadow(
				document.getElementById("NestedHost"),
				`<table>
					<thead><tr><th>Order</th><th>Items</th></tr></thead>
					<tbody>
						<tr><td>A-1</td><td><item-list id="Items"></item-list></td></tr>
						<tr><td>A-2</td><td>None</td></tr>
					</tbody>
				</table>`
			);
			shadow(
				orders.getElementById("Items"),
				`<table class="nested">
					<thead><tr><th>Item</th><th>Count</th></tr></thead>
					<tbody>
						<tr><td>Bikes</td><td>3</td></tr>
						<tr><td>Cars</td><td>4</td></tr>
					</tbody>
				</table>`
			);
		</script>
	</body>
</html>
